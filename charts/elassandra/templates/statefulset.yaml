apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "elassandra.fullname" . }}
  labels:
    {{- include "elassandra.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "elassandra.fullname" . }}-headless
  replicas: {{ .Values.replicaCount }}
  podManagementPolicy: {{ .Values.elassandra.podManagementPolicy }}
  selector:
    matchLabels:
      {{- include "elassandra.selectorLabels" . | nindent 6 }}
  updateStrategy:
    {{- toYaml .Values.elassandra.updateStrategy | nindent 4 }}
  template:
    metadata:
      labels:
        {{- include "elassandra.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "elassandra.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.elassandra.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: elassandra
          image: {{ include "elassandra.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: internode
              containerPort: 7000
            - name: internode-tls
              containerPort: 7001
            - name: jmx
              containerPort: {{ .Values.cqlService.jmxPort }}
            - name: cql
              containerPort: {{ .Values.cqlService.port }}
            - name: thrift
              containerPort: {{ .Values.cqlService.thriftPort }}
            - name: http
              containerPort: {{ .Values.searchService.port }}
            - name: transport
              containerPort: 9300
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: CASSANDRA_CLUSTER_NAME
              value: {{ .Values.elassandra.clusterName | quote }}
            - name: CASSANDRA_DC
              value: {{ .Values.elassandra.datacenter | quote }}
            - name: CASSANDRA_RACK
              value: {{ .Values.elassandra.rack | quote }}
            - name: CASSANDRA_NUM_TOKENS
              value: {{ .Values.elassandra.numTokens | quote }}
            - name: CASSANDRA_ENDPOINT_SNITCH
              value: {{ .Values.elassandra.endpointSnitch | quote }}
            - name: CASSANDRA_SEEDS
              value: {{ include "elassandra.seedHost" . | quote }}
            - name: CASSANDRA_LISTEN_ADDRESS
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: CASSANDRA_BROADCAST_ADDRESS
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: CASSANDRA_RPC_ADDRESS
              value: "0.0.0.0"
            - name: CASSANDRA_BROADCAST_RPC_ADDRESS
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: MAX_HEAP_SIZE
              value: {{ .Values.elassandra.heap.max | quote }}
            - name: HEAP_NEWSIZE
              value: {{ .Values.elassandra.heap.newSize | quote }}
            - name: LOCAL_JMX
              value: "no"
            - name: JMX_PORT
              value: {{ .Values.cqlService.jmxPort | quote }}
            - name: JVM_OPTS
              value: {{ join " " .Values.elassandra.jvmOpts | quote }}
            {{- with .Values.elassandra.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.elassandra.storage.dataMountPath }}
            - name: logs
              mountPath: {{ .Values.elassandra.storage.logsMountPath }}
          startupProbe:
            tcpSocket:
              port: cql
            failureThreshold: 60
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: cql
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /_cluster/health?local=true
              port: http
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.elassandra.resources | nindent 12 }}
      {{- if not .Values.elassandra.persistence.enabled }}
      volumes:
        - name: data
          emptyDir: {}
        - name: logs
          emptyDir: {}
      {{- else }}
      volumes:
        - name: logs
          emptyDir: {}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.elassandra.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "elassandra.labels" . | nindent 10 }}
      spec:
        accessModes:
          {{- toYaml .Values.elassandra.persistence.accessModes | nindent 10 }}
        resources:
          requests:
            storage: {{ .Values.elassandra.persistence.size }}
        {{- if .Values.elassandra.persistence.storageClass }}
        storageClassName: {{ .Values.elassandra.persistence.storageClass | quote }}
        {{- end }}
  {{- end }}
