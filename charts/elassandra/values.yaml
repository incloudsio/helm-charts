image:
  repository: elassandra.azurecr.io/elassandra
  tag: "1.3.23"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 0

securityContext:
  runAsUser: 1000
  runAsGroup: 0
  runAsNonRoot: true
  allowPrivilegeEscalation: false

replicaCount: 1

elassandra:
  clusterName: elassandra
  datacenter: dc1
  rack: rack1
  numTokens: 16
  endpointSnitch: GossipingPropertyFileSnitch
  seeds: ""
  heap:
    max: 1G
    newSize: 256M
  jvmOpts:
    - -Dcassandra.custom_query_handler_class=org.elassandra.index.ElasticQueryHandler
  extraEnv: []
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      memory: 2Gi
  persistence:
    enabled: true
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 10Gi
  storage:
    dataMountPath: /usr/share/elassandra/data
    logsMountPath: /usr/share/elassandra/logs
  terminationGracePeriodSeconds: 120
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate

headlessService:
  annotations: {}
  publishNotReadyAddresses: true

cqlService:
  type: ClusterIP
  annotations: {}
  port: 9042
  jmxPort: 7199
  thriftPort: 9160
  nodePorts:
    cql: null
    jmx: null
    thrift: null

searchService:
  type: ClusterIP
  annotations: {}
  port: 9200
  nodePort: null

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

dashboards:
  enabled: false
  replicaCount: 1
  image:
    repository: opensearchproject/opensearch-dashboards
    tag: 1.3.20
    pullPolicy: IfNotPresent
  opensearchHosts: []
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 512Mi
  podAnnotations: {}
  podLabels: {}
  extraEnv: []
  service:
    type: ClusterIP
    annotations: {}
    port: 5601
    nodePort: null
