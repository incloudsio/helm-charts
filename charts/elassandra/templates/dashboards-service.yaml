{{- if .Values.dashboards.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "elassandra.fullname" . }}-dashboards
  labels:
    {{- include "elassandra.labels" . | nindent 4 }}
  {{- with .Values.dashboards.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.dashboards.service.type }}
  selector:
    {{- include "elassandra.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: dashboards
  ports:
    - name: http
      port: {{ .Values.dashboards.service.port }}
      targetPort: http
      {{- if and (eq .Values.dashboards.service.type "NodePort") .Values.dashboards.service.nodePort }}
      nodePort: {{ .Values.dashboards.service.nodePort }}
      {{- end }}
{{- end }}
