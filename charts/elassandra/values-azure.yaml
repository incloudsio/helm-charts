image:
  repository: elassandra.azurecr.io/elassandra
  tag: "1.3.23"

replicaCount: 3

elassandra:
  heap:
    max: 2G
    newSize: 512M
  resources:
    requests:
      cpu: "1"
      memory: 4Gi
    limits:
      memory: 4Gi
  persistence:
    storageClass: managed-csi
    size: 100Gi

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: elassandra
